name: Bug report
description: Report something broken in the current product
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This issue will be auto-triaged by the Dark Factory — please fill in every section so it has enough to work with. Vague issues get rejected.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, specific description of the buggy behavior.
      placeholder: "Describe what you did and what went wrong."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: "Describe the behavior you expected."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ordered list of steps. The factory's regression test must be able to reproduce this against the product's API, so include the exact inputs.
      placeholder: |
        1. The exact request or input
        2. What you observed
        3. What you expected instead
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Product version, operating system, and anything else relevant to reproducing the problem.
      placeholder: "Product 0.1.0, Linux"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Paste any error shown to the user or lines from the service log.
      render: shell
    validations:
      required: false
