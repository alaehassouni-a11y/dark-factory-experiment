name: Feature request
description: Propose a new capability or an improvement to an existing one
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check `MISSION.md` in the repo root. Anything listed under "Out of Scope" will be rejected by triage. The factory will only build features that fall inside MISSION.md's "Core Capabilities" or "Allowed Evolutions".
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What is the client trying to do that they currently can't?
      placeholder: "When the wiki has nothing on a question, the agent searches the web even though I'd rather it told me it doesn't know."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the feature as a client would experience it. What do they say to the agent? What does the agent say back, in which language, and from which source?
    validations:
      required: true
  - type: textarea
    id: scope-check
    attributes:
      label: Scope check
      description: Which MISSION.md "Core Capability" or "Allowed Evolution" does this fall under? Quote the section if possible.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will you know this is done? List concrete, checkable conditions the API-level journey (open a session, post turns, read the transcript) can verify without a phone.
      placeholder: |
        - A turn asked in French about a topic the wiki covers is answered in French with source "wiki" and the document name
        - A turn about a topic neither the wiki nor the web covers returns source "none" and an "I don't know" in the client's language
        - A second client's token is rejected with 401 when it tries to read the first client's session
    validations:
      required: true
