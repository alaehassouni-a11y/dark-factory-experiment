services:
  caddy:
    image: caddy:2.8-alpine
    container_name: virtualagent-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream.conf:/etc/caddy/upstream.conf:ro
      - caddy_data:/data
      - caddy_config:/config
    # No extra_hosts — the app lives in-network and is reachable by service
    # name (app-blue / app-green). upstream.conf switches between them.

  # ---- Blue/green app services --------------------------------------------
  # Identical except for name. /opt/virtualagent/deploy.sh rebuilds the
  # inactive color, waits for its healthcheck, then rewrites upstream.conf and
  # does a graceful `caddy reload` to swap. Neither publishes a host port —
  # Caddy reaches them via the internal docker network by service name.
  #
  # There is no database and no content volume. The service keeps sessions
  # in-process (they expire after 24h) and the wiki is baked into the image,
  # so a colour is fully described by its image + these environment variables.
  #
  app-blue:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: virtualagent-app:latest
    container_name: virtualagent-app-blue
    restart: unless-stopped
    environment:
      # Required. OpenRouter is the only inference provider (chat + the
      # embeddings that index the wiki). The service refuses to start without it.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Optional. Brave Search key for the web fallback. Unset means the agent
      # says it does not know when the wiki has no confident answer.
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      # The wiki copied into the image by deploy/Dockerfile. Fixed, not read
      # from .env — a host-side path here would let the image and the wiki
      # drift apart.
      WIKI_RESOURCES_DIR: /app/virtualagent/resources
      # Optional. Comma-separated browser origins. The iOS app needs none.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # OpenRouter chat model override. Default matches the prod baseline;
      # canary deploys override it to test a new model on the inactive
      # blue/green slot before flipping Caddy.
      CHAT_MODEL: ${CHAT_MODEL:-anthropic/claude-sonnet-4.6}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  app-green:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: virtualagent-app:latest
    container_name: virtualagent-app-green
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      WIKI_RESOURCES_DIR: /app/virtualagent/resources
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CHAT_MODEL: ${CHAT_MODEL:-anthropic/claude-sonnet-4.6}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
