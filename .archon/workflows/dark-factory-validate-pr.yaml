name: dark-factory-validate-pr
description: |
  Use when: Dark Factory orchestrator wants to validate a PR labeled `factory:needs-review`
            against its linked issue, run static + unit + E2E (API journey) checks under
            the holdout pattern, optionally self-fix issues in a fresh-context session,
            re-validate, and render a final verdict.
  Triggers: Orchestrator dispatch for `factory:needs-review`, or manual "validate PR #N".
  Does: Fetches PR + linked issue + base-branch governance -> starts the Virtual Agent
        service on a dynamic port against stub providers -> runs THE GATE
        (harness/ci.py: static, unit, the section 4 journey, the holdout, the mutation
        set, then harness/ratchet.py against the floors) + a deterministic
        protected-path and PR-size check + four HOLDOUT reviewers (behavioral,
        API E2E, security, code review) -> synthesizes a verdict, which bash
        overrides if the gate was red, if the app never started, or if the PR
        touched a protected path or blew the size cap.
        If request_changes, runs a fresh-context fix pass, then a second full validation
        pass (all reviewers re-run on the updated diff). Always tears down the app,
        then applies the final verdict (approve / request_changes / reject).
  NOT for: Triage (dark-factory-triage), initial implementation (dark-factory-fix-github-issue),
           weekly full-suite E2E (dark-factory-comprehensive-test).

  Combines what used to be two workflows (validate-pr + fix-pr) into one state machine,
  so fix and re-validate happen in the same orchestrator dispatch with different
  fresh-context sessions. This is the user-requested "validate it AND fix it in one
  workflow" shape.

  ═══════════════════════════════════════════════════════════════════════════
  HOLDOUT PRINCIPLE — the core design constraint
  ═══════════════════════════════════════════════════════════════════════════

  The validator must NEVER see implementation artifacts or coder rationale. It
  tests the OUTCOME (diff + running app + tests) against the CONTRACT (issue body
  + base-branch governance). This is the StrongDM holdout pattern — the single
  most important defense against AI coding agents gaming their own quality
  signal.

  How the holdout is enforced in this workflow (six overlapping layers):

  1. Cross-workflow isolation — runs as a separate Archon workflow with its own
     $ARTIFACTS_DIR and worktree. Never references sibling-workflow state.

  2. Holdout-safe fetches — gh pr view excludes `comments`/`reviews`; gh issue
     view fetches only title/body/labels. No coder chatter reaches the reviewers.

  3. Poison immunity — FACTORY_RULES.md, MISSION.md, CLAUDE.md are fetched from
     `origin/main` BEFORE `gh pr checkout`. A PR cannot weaken its own rulebook.
     Any diff touching governance files is an automatic REJECT. The same applies
     to the judge itself: `checkout-pr` overlays `harness/`, `.factory/`,
     `scripts/factory-stop.sh`, `.archon/` and `.claude/` from `origin/main`
     over the PR's worktree, so the gate, the holdout, the mutation set and the
     ratchet floors that judge a PR are always main's, never the PR's own copy.
     `check-protected-paths` then rejects the PR for having touched them at all.

  4. Fresh context and the narrowest tool list each AI node can do its job with.
     The behavioral reviewers, the security checks and both synthesizers have
     `allowed_tools: []` — they work from node outputs alone. The E2E reviewer
     has `[Bash]` (only to drive the running service with curl) and is
     explicitly forbidden from reading source. The code reviewers have
     `[Read, Grep, Glob]`: they must read the tree to review it, but they
     cannot run commands, and they run only after the gate has finished so the
     mutation set is not rewriting files under them. No reviewer node has the
     full tool list.

  5. Command-file explicit prohibitions — every AI node loads a .md command file
     whose leading section enumerates what must not be read (plans, commit
     messages, coder rationale, prior comments, sibling-workflow files).

  6. Fix/validate session isolation — the fix phase (Phase 6) runs in a fresh
     context. When Phase 7's validators re-run, they ALSO run in fresh contexts.
     The fixer's reasoning never leaks into the second validation pass — pass-2
     reviewers see only the updated diff and the running app.

  Prerequisite: `uv` on PATH (the service runs under `app/backend/.venv`) and a
  `python` that can run `harness/serve.py`. The service's only client is an iOS
  app that cannot run on the factory's machines, so the E2E journey is the API
  contract in `docs/API.md`, driven exactly as the app drives it. `serve.py`
  starts stub providers, so no secrets, no network and no env file are needed.

provider: claude
model: sonnet

nodes:
  # ═══════════════════════════════════════════════════════════════
  # PHASE 1: EXTRACT + HOLDOUT-SAFE CONTEXT FETCH
  # ═══════════════════════════════════════════════════════════════

  - id: extract-pr-number
    command: dark-factory-extract-pr-number
    model: haiku
    allowed_tools: [Bash]

  - id: fetch-pr
    bash: |
      set -euo pipefail
      PR_NUMBER=$(echo "$extract-pr-number.output" | tr -d "'\"\`\n " | grep -oE '[0-9]+' | head -1)
      if [ -z "$PR_NUMBER" ]; then
        echo "ERROR: Failed to extract PR number from: $extract-pr-number.output" >&2
        exit 1
      fi
      echo "$PR_NUMBER" > "$ARTIFACTS_DIR/.pr-number"
      # HOLDOUT: fetch only fields the validator needs.
      # NO comments, NO reviews, NO commit messages.
      gh pr view "$PR_NUMBER" --json number,title,body,url,headRefName,baseRefName,additions,deletions,changedFiles,state,author,labels
    depends_on: [extract-pr-number]
    timeout: 20000

  - id: fetch-diff
    bash: |
      set -euo pipefail
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number")
      # Cap at 3000 lines — FACTORY_RULES.md §3 already caps PRs at 500 lines
      # changed; the 3000-line cap here is a defense against accidental huge diffs.
      gh pr diff "$PR_NUMBER" | head -3000
    depends_on: [fetch-pr]
    timeout: 20000

  - id: fetch-linked-issue
    bash: |
      set -euo pipefail
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number")
      ISSUE_NUM=$(gh pr view "$PR_NUMBER" --json body -q '.body' \
        | grep -oiE '(fixes|closes|resolves) #[0-9]+' \
        | grep -oE '[0-9]+' | head -1)
      if [ -n "$ISSUE_NUM" ]; then
        # HOLDOUT: title + body + labels only. NO comments.
        gh issue view "$ISSUE_NUM" --json number,title,body,labels,state,url
      else
        echo '{"error": "No linked issue found in PR body. Factory PRs must link via Fixes/Closes/Resolves per FACTORY_RULES.md."}'
      fi
    depends_on: [fetch-pr]
    timeout: 20000

  - id: fetch-base-governance
    bash: |
      set -euo pipefail
      # POISON IMMUNITY: read governance files from origin/main, NOT from the PR.
      git fetch origin main --quiet 2>/dev/null || true
      BASE_REF="origin/main"
      echo "=== FACTORY_RULES.md (from $BASE_REF) ==="
      git show "$BASE_REF:FACTORY_RULES.md" 2>/dev/null || echo "(FACTORY_RULES.md not present on base branch)"
      echo ""
      echo "=== MISSION.md (from $BASE_REF) ==="
      git show "$BASE_REF:MISSION.md" 2>/dev/null || echo "(MISSION.md not present on base branch)"
      echo ""
      echo "=== CLAUDE.md (from $BASE_REF) ==="
      git show "$BASE_REF:CLAUDE.md" 2>/dev/null || echo "(CLAUDE.md not present on base branch)"
    timeout: 15000

  # Tripwire: fail loudly if fix-workflow artifacts ever leak into $ARTIFACTS_DIR.
  # Should be impossible under normal Archon isolation.
  - id: verify-holdout-clean
    bash: |
      set -euo pipefail
      FORBIDDEN_ARTIFACTS=(plan.md investigation.md implementation.md validation.md fix-notes.md)
      LEAKED=()
      for f in "${FORBIDDEN_ARTIFACTS[@]}"; do
        if [ -e "$ARTIFACTS_DIR/$f" ]; then LEAKED+=("$f"); fi
      done
      if [ ${#LEAKED[@]} -gt 0 ]; then
        echo "HOLDOUT VIOLATION: \$ARTIFACTS_DIR contains leaked fix-workflow artifacts: ${LEAKED[*]}" >&2
        echo "This should be impossible under normal Archon isolation. Aborting validation." >&2
        exit 1
      fi
      echo "HOLDOUT_CLEAN: no fix-workflow artifacts in \$ARTIFACTS_DIR"
    timeout: 5000

  - id: checkout-pr
    bash: |
      set -euo pipefail
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number")
      # Defensive: drop any stray untracked files in infra directories before
      # switching branches. If the VPS-side main has untracked files in
      # .archon/ or .claude/ (e.g., experimental workflows that haven't been
      # committed), Archon's worktree creation can carry them in and gh pr
      # checkout will refuse to overwrite them when the PR adds the same
      # paths as tracked files. Cleaning here makes checkout deterministic.
      git clean -fd .archon/ .claude/ 2>/dev/null || true

      # Stale worktree prune. Archon doesn't always clean up worktrees after
      # a run completes — even successful runs. If the preceding
      # fix-github-issue workflow left its worktree pointing at this PR's
      # branch, `gh pr checkout` will fail with
      #   fatal: branch 'X' is already used by worktree at '...'
      # So we proactively discover any other worktree holding this PR's
      # branch and force-remove it. Idempotent: no-op on a clean repo.
      #
      # Self-skip: if the CURRENT worktree happens to hold the PR branch
      # already (e.g., a prior dispatch on the same `--branch` name reused
      # this worktree directory), we must NOT try to remove ourselves —
      # that corrupts our own .git pointer mid-run.
      #
      # We compare against `git rev-parse --show-toplevel` rather than
      # `$(pwd)` because on Windows Git Bash, `$(pwd)` can return a path
      # with different casing / separator normalization than what
      # `git worktree list --porcelain` emits, causing the self-skip
      # guard to fail silently. `git rev-parse --show-toplevel` emits
      # the git-canonical path in the same format the porcelain listing
      # uses, so string equality is reliable.
      PR_BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName -q '.headRefName')
      if [ -n "$PR_BRANCH" ]; then
        echo "Checking for stale worktrees holding branch '$PR_BRANCH'..."
        git worktree prune
        CURRENT_WT=$(git rev-parse --show-toplevel 2>/dev/null || echo "")
        echo "Current worktree (canonical): $CURRENT_WT"
        git worktree list --porcelain | awk -v b="$PR_BRANCH" '
          /^worktree / {w=$2}
          $0 == "branch refs/heads/" b {print w}
        ' | while read -r stale_wt; do
          if [ -z "$stale_wt" ]; then
            continue
          fi
          if [ "$stale_wt" = "$CURRENT_WT" ]; then
            echo "Skipping self (current worktree holds PR branch): $stale_wt"
            continue
          fi
          echo "Removing stale worktree: $stale_wt"
          git worktree remove --force "$stale_wt" 2>&1 || true
        done
        git worktree prune
      fi

      gh pr checkout "$PR_NUMBER"
      echo "Checked out PR #$PR_NUMBER on branch $(git branch --show-current)"

      # Pin the commit this run is about to gate. Everything downstream — the
      # gate, the holdout, the mutation set, the E2E journey — exercises THIS
      # sha and nothing else, and apply-verdict refuses to merge anything else
      # (`gh pr merge --match-head-commit`). Without the pin, a push landing
      # between the gate and the merge ships ungated code under a review that
      # claims every gate passed.
      VALIDATED_SHA=$(git rev-parse HEAD)
      echo "$VALIDATED_SHA" > "$ARTIFACTS_DIR/.validated-sha"
      REMOTE_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
      if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$VALIDATED_SHA" ]; then
        echo "WARN: worktree HEAD $VALIDATED_SHA != PR head $REMOTE_SHA; pinning the checked-out sha" >&2
      fi
      echo "VALIDATED_SHA $VALIDATED_SHA"

      # Pull infra-only files from origin/main into the worktree so the
      # validator always uses the latest workflow command files and skills,
      # regardless of how stale the PR branch is. We deliberately do NOT
      # merge main's app code — the validator must see the PR's diff
      # exactly as the author wrote it. Governance was captured into the
      # fetch-base-governance artifact BEFORE this checkout, so the
      # holdout property is preserved either way.
      #
      # The overlay covers the JUDGE as well as the prompts: harness/ is the
      # gate and the mutation set, .factory/ is the holdout and the ratchet
      # floors, scripts/factory-stop.sh is the stop button. A PR that edits
      # any of them would otherwise be judged by its own edits, which is the
      # one thing FACTORY_RULES §5 exists to prevent. harness/mutations/run.py
      # tolerates a dirty tree outside its own defect files, so overlaying
      # here does not disturb the mutation rung.
      git fetch origin main --quiet
      JUDGE_PATHS=".archon/ .claude/ harness/ .factory/ scripts/factory-stop.sh"
      # Discard any local changes in infra dirs before overlaying main's
      # versions. Without this, restoring from origin/main fails when the
      # worktree was created from a stale commit and the infra files have
      # been modified since (e.g., we just pushed a workflow fix to main).
      git restore --worktree -- $JUDGE_PATHS 2>/dev/null || true
      # `restore --worktree` (not `git checkout origin/main -- <paths>`) on
      # purpose: checkout writes the INDEX as well, which leaves main-vs-branch
      # drift staged. The fixer in Phase 6 would then commit our overlay as if
      # the PR had edited governance, and pass-2's security check would reject
      # the PR for a change the validator itself made.
      git restore --source=origin/main --worktree -- $JUDGE_PATHS 2>/dev/null || true
      # Belt and braces: whatever git version is on the host, leave the index
      # matching the PR's own tree for these paths.
      git reset -q -- $JUDGE_PATHS 2>/dev/null || true
      echo "Synced the judge and the prompts from origin/main (worktree only):"
      git status --short $JUDGE_PATHS | head -20 || true
    depends_on: [fetch-pr, verify-holdout-clean, fetch-base-governance]
    timeout: 60000

  # ─────────────────────────────────────────────────────────────────
  # The two rules a model should never be the only reader of: which
  # files a PR may not touch, and how big a PR may be. Both are pure
  # data — a file list and an integer — so both are bash, not prose in
  # a reviewer's prompt read off a diff that `head -3000` may have
  # truncated. apply-verdict requires this node's markers exactly the
  # way it requires APP_STARTED.
  # ─────────────────────────────────────────────────────────────────
  - id: check-protected-paths
    bash: |
      set +e
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number")
      LIST=".factory/protected-paths.txt"
      if [ ! -f "$LIST" ]; then
        # Fail closed and loudly: no list means no protection.
        echo "PROTECTED_TOUCHED path=<list-missing:$LIST>"
        echo "SIZE_EXCEEDED reason=protected-paths-list-missing"
        exit 0
      fi
      # The list is authored on whatever machine a human happened to use, so
      # strip CR before matching: a trailing \r turns every pattern into one
      # that matches nothing and this check into a rubber stamp.
      tr -d '\r' < "$LIST" > "$ARTIFACTS_DIR/.protected-list"
      LIST="$ARTIFACTS_DIR/.protected-list"

      # `gh pr view --json files` is paginated by the API. Compare the number
      # of rows we got against the PR's own changedFiles count and refuse to
      # declare the PR clean if they disagree — a truncated file list would
      # otherwise read as "nothing protected was touched".
      META=$(gh pr view "$PR_NUMBER" --json files,changedFiles,additions,deletions 2>/dev/null)
      if [ -z "$META" ]; then
        echo "PROTECTED_TOUCHED path=<gh-pr-view-failed>"
        echo "SIZE_EXCEEDED reason=gh-pr-view-failed"
        exit 0
      fi
      CHANGED_FILES=$(echo "$META" | jq -r '.changedFiles')
      LISTED=$(echo "$META" | jq -r '.files | length')
      ADDITIONS=$(echo "$META" | jq -r '.additions')
      DELETIONS=$(echo "$META" | jq -r '.deletions')
      echo "$META" | jq -r '.files[].path' > "$ARTIFACTS_DIR/.changed-files"

      if [ "$LISTED" != "$CHANGED_FILES" ]; then
        echo "PROTECTED_TOUCHED path=<file-list-truncated listed=$LISTED changedFiles=$CHANGED_FILES>"
        echo "SIZE_EXCEEDED reason=file-list-truncated"
        exit 0
      fi

      # The list format, one glob per line:
      #   plain    a hard match — touching it is an auto-reject
      #   ?glob    partially protected — only part of the file is an invariant,
      #            so a reviewer reads the diff; reported, never blocking
      #   !glob    an exemption, checked first (the committed .env.example
      #            templates are documentation)
      # `case` is used for matching, so `**` is normalised to `*`: an unquoted
      # `*` in a case pattern already crosses `/`.
      HARD=""
      PARTIAL=""
      while IFS= read -r path; do
        [ -z "$path" ] && continue
        VERDICT=""
        while IFS= read -r raw; do
          case "$raw" in ''|'#'*) continue ;; esac
          pat="${raw%%[[:space:]]#*}"
          kind="hard"
          case "$pat" in
            '!'*) kind="exempt"; pat="${pat#!}" ;;
            '?'*) kind="partial"; pat="${pat#\?}" ;;
          esac
          pat=$(echo "$pat" | sed 's/\*\*/*/g')
          case "$path" in
            $pat)
              if [ "$kind" = "exempt" ]; then VERDICT="exempt"; break; fi
              if [ "$kind" = "hard" ]; then VERDICT="hard"; break; fi
              VERDICT="partial"
              ;;
          esac
        done < "$LIST"
        case "$VERDICT" in
          hard)    HARD="$HARD $path" ;;
          partial) PARTIAL="$PARTIAL $path" ;;
        esac
      done < "$ARTIFACTS_DIR/.changed-files"

      for p in $PARTIAL; do
        echo "PROTECTED_PARTIAL path=$p (invariant-bearing; the reviewers read this diff)"
      done
      if [ -n "$HARD" ]; then
        for p in $HARD; do
          echo "PROTECTED_TOUCHED path=$p"
        done
      else
        echo "PROTECTED_CLEAN files=$CHANGED_FILES"
      fi

      TOTAL=$((ADDITIONS + DELETIONS))
      if [ "$TOTAL" -le 500 ]; then
        echo "SIZE_OK lines=$TOTAL"
      else
        echo "SIZE_EXCEEDED lines=$TOTAL limit=500"
      fi
      # Always exit 0: this node reports, apply-verdict decides. A non-zero
      # exit would skip apply-verdict and leave the PR stuck with no comment.
      exit 0
    depends_on: [fetch-pr]
    timeout: 30000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 2: INSTALL DEPS + START THE SERVICE FOR E2E
  # ═══════════════════════════════════════════════════════════════
  # We need the service running before the E2E reviewer can drive it.
  # Dynamic port allocation so parallel workflow runs don't collide.

  # There is deliberately no allocate-ports node any more. A port chosen
  # minutes before it is bound is a port another run can take in between:
  # `install-deps` sits between the two and runs 3-5 minutes, and
  # FACTORY_RULES §8 allows four workflows at once, all scanning the same
  # range from its lowest port. The second run's health poll would then
  # succeed against the FIRST run's service and the E2E reviewer would render
  # a verdict on someone else's code. start-app now picks the port
  # immediately before it launches, and proves the service answering on it is
  # the process it started.

  - id: install-deps
    bash: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      echo "=== Backend deps (uv sync) ==="
      (cd app/backend && uv sync --all-extras 2>&1 | tail -10)
      echo "=== Wiki import tool deps (uv sync) ==="
      # tools/wiki is a second uv project and the static and unit rungs lint
      # and test it too. Its ruff and pytest live in its `dev` extra, which a
      # bare `uv run` never installs: on a fresh worktree that made rung 1
      # fail with "Failed to spawn: ruff" and misrouted every PR.
      (cd tools/wiki && uv sync --all-extras 2>&1 | tail -10)
      echo ""
      # Warm the mypy cache. Cold mypy on this backend is slow enough to
      # matter to the gate, whose mutation rung re-runs the static rung once
      # per defect. All DAG nodes in a run share this worktree, so the cache
      # we populate here is the cache harness/ci.py will hit.
      # Type errors are non-fatal here — the cache populates regardless,
      # and the real verdict comes from the gate's static rung.
      echo "=== Warming mypy cache ==="
      (cd app/backend && uv run mypy . 2>&1 | tail -3) || true
    depends_on: [checkout-pr]
    # Bash nodes ignore idle_timeout — only `timeout` is honored (default
    # 120000ms). Must set explicitly: uv sync + cold mypy together can
    # run 3-5 minutes on a fresh worktree.
    timeout: 600000

  - id: start-app
    bash: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"

      # `harness/serve.py` is the ONLY way the factory starts the service for
      # validation. It boots stub providers (an OpenAI-shaped model and a
      # Brave-shaped search) on a free port, points the service at them and
      # at `harness/fixtures/wiki` through the same environment variables
      # production uses, then runs uvicorn as a child that dies with it. No
      # secrets, no network, no env file: the whole journey in docs/API.md
      # runs against stubs, so this node needs nothing from the VPS. It
      # refuses loudly (APP_START_REFUSED) when `uv` is missing.
      PYTHON=$(command -v python || command -v python3)
      mkdir -p "$ARTIFACTS_DIR/app-logs"

      # Pick the port HERE, in the same breath as the bind. A port is only
      # free until someone else takes it, and up to four validate-pr runs
      # share this machine.
      find_free_port() {
        local start=$1 end=$2
        for port in $(seq $start $end); do
          if ! (echo >/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
            echo $port; return 0
          fi
        done
        echo "ERROR: no free port in range $start-$end" >&2; return 1
      }

      # Randomise the scan start so two runs launching in the same second do
      # not both settle on 15100.
      SCAN_FROM=$((15100 + (RANDOM % 800)))

      STARTED="no"
      for attempt in 1 2 3 4 5; do
        BACKEND_PORT=$(find_free_port "$SCAN_FROM" 15999)
        LOG="$ARTIFACTS_DIR/app-logs/backend.log"

        # Service + stub providers, in the background, logs to artifacts.
        nohup "$PYTHON" harness/serve.py --port "$BACKEND_PORT" > "$LOG" 2>&1 &
        BACKEND_PID=$!
        echo "$BACKEND_PID" > "$ARTIFACTS_DIR/.backend-pid"
        echo "attempt $attempt: serve.py pid=$BACKEND_PID port=$BACKEND_PORT"

        # Wait for health. The service answers GET /api/health with
        # {"status":"ok",...} once the wiki has loaded (boot can take a
        # while on a cold worktree: uv resolves the venv first).
        HEALTHY="no"
        for i in $(seq 1 90); do
          if curl -sf "http://127.0.0.1:$BACKEND_PORT/api/health" 2>/dev/null | grep -qE '"status": ?"ok"'; then
            echo "backend up after ${i}s"; HEALTHY="yes"; break
          fi
          # A port that was free a second ago can be taken by a sibling run
          # between find_free_port and uvicorn's bind. uvicorn says so and
          # exits; serve.py returns its code, so this node would otherwise
          # poll a stranger's healthy service for 90s and believe it.
          if grep -qi 'address already in use' "$LOG" 2>/dev/null; then
            echo "WARN: port $BACKEND_PORT was taken between allocation and bind; retrying higher" >&2
            SCAN_FROM=$((BACKEND_PORT + 1))
            break
          fi
          if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
            echo "ERROR: serve.py (pid $BACKEND_PID) exited before the service came up" >&2
            tail -50 "$LOG" >&2
            break
          fi
          sleep 1
        done

        if [ "$HEALTHY" != "yes" ]; then
          kill "$BACKEND_PID" 2>/dev/null || true
          continue
        fi

        # Health alone proves only that SOMETHING answers on this port. These
        # two lines prove it is ours: our process is still alive, and our own
        # log says uvicorn finished booting.
        if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
          echo "ERROR: health answered but pid $BACKEND_PID is gone — that service belongs to another run" >&2
          SCAN_FROM=$((BACKEND_PORT + 1))
          continue
        fi
        if ! grep -q 'Application startup complete' "$LOG" 2>/dev/null; then
          echo "ERROR: health answered but $LOG never logged 'Application startup complete' — that service is not ours" >&2
          kill "$BACKEND_PID" 2>/dev/null || true
          SCAN_FROM=$((BACKEND_PORT + 1))
          continue
        fi

        STARTED="yes"
        break
      done

      if [ "$STARTED" != "yes" ]; then
        echo "ERROR: could not start the service on a port of our own after 5 attempts" >&2
        tail -50 "$ARTIFACTS_DIR/app-logs/backend.log" >&2
        exit 1
      fi

      # Downstream nodes (behavioral-e2e-p1, restart-app-p2) read the port
      # from here, so write it only once the service is proven ours.
      echo "$BACKEND_PORT" > "$ARTIFACTS_DIR/.backend-port"
      echo "APP_STARTED backend=$BACKEND_PORT pid=$(cat "$ARTIFACTS_DIR/.backend-pid")"
    depends_on: [install-deps, checkout-pr]
    idle_timeout: 180000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3a: THE GATE (deterministic, the third code gate)
  # ═══════════════════════════════════════════════════════════════
  # harness/ci.py is the ladder: static, unit, the FACTORY_RULES §4 journey
  # against a live service (its own port, its own stub providers), the
  # holdout the builder cannot read, and the mutation set. Then
  # harness/ratchet.py asserts every observed count is at least its floor in
  # .factory/locks/floor.json and that the PR did not lower a floor relative
  # to origin/main. The full log is an artifact; only marker lines are
  # echoed, because apply-verdict greps THIS node's output for GATE_OK and
  # RATCHET_OK and overrides any approve without them. Until 2026-09-04 the
  # holdout and the mutation set ran only when a person ran them.

  - id: gate
    bash: |
      set +e
      export PATH="$HOME/.local/bin:$PATH"
      PYTHON=$(command -v python || command -v python3)
      "$PYTHON" harness/ci.py > "$ARTIFACTS_DIR/gate.log" 2>&1
      GATE_RC=$?
      # The ratchet asserts observed counts against the floors in
      # .factory/locks/floor.json. It can only do that against a log that ends
      # in GATE_OK; run against a red log it prints RATCHET_FAILED, which the
      # synthesizer reads as "a floor was lowered" and escalates to a human.
      # A ruff error is not a lowered floor. Run the ratchet only on a green
      # gate; otherwise say plainly that it did not run, so the common red
      # build reaches the fix pass instead of a person.
      if [ $GATE_RC -eq 0 ]; then
        "$PYTHON" harness/ratchet.py "$ARTIFACTS_DIR/gate.log" --base origin/main >> "$ARTIFACTS_DIR/gate.log" 2>&1
        RATCHET_RC=$?
      else
        RATCHET_RC=0
        echo "RATCHET_SKIPPED gate_red" >> "$ARTIFACTS_DIR/gate.log"
      fi
      grep -E '^(HARNESS_START|STATIC_|UNIT_|APP_STARTED|E2E_|HOLDOUT_|MUTATION|GATE_|RATCHET_|  (ok|CAUGHT|ESCAPED|NOT_INJECTED|RATCHET_FAIL|E2E_FAIL|HOLDOUT_FAIL) )' "$ARTIFACTS_DIR/gate.log"
      if [ $GATE_RC -ne 0 ] || [ $RATCHET_RC -ne 0 ]; then
        echo "--- tail of gate.log ---"
        tail -60 "$ARTIFACTS_DIR/gate.log"
      fi
      echo "GATE_NODE_DONE gate_rc=$GATE_RC ratchet_rc=$RATCHET_RC"
      [ $GATE_RC -eq 0 ] && [ $RATCHET_RC -eq 0 ]
    depends_on: [install-deps, checkout-pr]
    # The mutation set re-runs static + unit + holdout per defect; eight
    # defects is the better part of half an hour on the VPS.
    timeout: 2400000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 3: (no separate static / unit nodes — the gate owns those rungs)
  # ═══════════════════════════════════════════════════════════════
  # There used to be a static-checks-backend-p1 and a run-tests-backend-p1
  # node here, each re-running what rungs 1 and 2 of harness/ci.py already
  # run — and running them CONCURRENTLY with the gate, whose mutation rung
  # rewrites rate_limit.py, languages.py, agent/pipeline.py and
  # routes/sessions.py in place for 15-25 minutes. A duplicate that reads the
  # same worktree during that window reports defects the judge injected.
  # The gate's own STATIC_OK and UNIT_PASSED markers are the single source
  # for both, and they cover static_ios.py, which the duplicates did not.
  # The synthesizers read those markers out of $gate.output / $gate-p2.output.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 4: PASS-1 HOLDOUT REVIEWERS (parallel, fresh context)
  # ═══════════════════════════════════════════════════════════════

  # Static behavioral: reads issue + PR metadata + diff. No filesystem, no tools.
  - id: behavioral-validation-p1
    command: dark-factory-behavioral-validation
    depends_on: [fetch-pr, fetch-diff, fetch-linked-issue]
    context: fresh
    allowed_tools: []
    output_format:
      type: object
      properties:
        solves_issue: { type: string, enum: ["yes", "partially", "no"] }
        asks_identified: { type: array, items: { type: string } }
        asks_addressed:  { type: array, items: { type: string } }
        asks_missed:     { type: array, items: { type: string } }
        regressions_detected: { type: array, items: { type: string } }
        scope_appropriate: { type: string, enum: ["yes", "too_narrow", "too_broad"] }
        unrequested_changes: { type: array, items: { type: string } }
        confidence: { type: string, enum: ["high", "medium", "low"] }
        reasoning: { type: string }
      required:
        - solves_issue
        - asks_identified
        - asks_addressed
        - asks_missed
        - regressions_detected
        - scope_appropriate
        - unrequested_changes
        - confidence
        - reasoning

  # E2E behavioral: drives the running service through the API with curl, exactly
  # as the iOS app drives it. This is the "real-world holdout" — observable
  # behavior, not source inspection.
  - id: behavioral-e2e-p1
    command: dark-factory-behavioral-e2e
    depends_on: [fetch-pr, fetch-linked-issue, start-app]
    context: fresh
    allowed_tools: [Bash]
    output_format:
      type: object
      properties:
        solves_issue: { type: string, enum: ["yes", "partially", "no", "not_e2e_testable"] }
        app_booted: { type: boolean }
        flows_tested: { type: array, items: { type: string } }
        criteria_results:
          type: array
          items:
            type: object
            properties:
              criterion: { type: string }
              result: { type: string, enum: ["pass", "fail", "skip"] }
              evidence: { type: string }
            required: [criterion, result, evidence]
        regressions_observed: { type: array, items: { type: string } }
        evidence_captured: { type: array, items: { type: string } }
        confidence: { type: string, enum: ["high", "medium", "low"] }
        reasoning: { type: string }
      required:
        - solves_issue
        - app_booted
        - flows_tested
        - criteria_results
        - regressions_observed
        - evidence_captured
        - confidence
        - reasoning

  - id: security-check-p1
    command: dark-factory-security-check
    # fetch-pr carries the PR body. FACTORY_RULES §2 makes the body the only
    # place a new dependency can be justified, and this node's schema requires
    # `new_dependencies_justified` — without the body it was guessing.
    depends_on: [fetch-pr, fetch-diff, fetch-base-governance]
    context: fresh
    allowed_tools: []
    output_format:
      type: object
      properties:
        security_issues:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: ["critical", "high", "medium", "low"] }
              category: { type: string, enum: ["secret", "injection", "dependency", "permission", "governance", "data_exposure"] }
              description: { type: string }
              file: { type: string }
              line: { type: string }
            required: [severity, category, description, file]
        governance_files_modified: { type: boolean }
        protected_files_touched: { type: array, items: { type: string } }
        new_dependencies: { type: array, items: { type: string } }
        new_dependencies_justified: { type: boolean }
        verdict: { type: string, enum: ["pass", "fail"] }
        reasoning: { type: string }
      required:
        - security_issues
        - governance_files_modified
        - protected_files_touched
        - new_dependencies
        - new_dependencies_justified
        - verdict
        - reasoning

  # The one reviewer that must read the tree, so the one reviewer that must
  # wait for the gate. harness/mutations/run.py edits four invariant-bearing
  # files in place and restores them at the end; a reviewer reading
  # rate_limit.py mid-rung sees DAILY_TURN_CAP = 1000 and reports a critical
  # breach the judge injected. `depends_on: [gate]` costs wall-clock and buys
  # a reviewer that reads the PR's code rather than the mutation set's.
  # Read-only tools only: it reviews, it does not run anything, and it has no
  # business in git history, $ARTIFACTS_DIR, harness/ or .factory/.
  - id: code-review-p1
    command: archon-code-review-agent
    depends_on: [gate]
    trigger_rule: all_done
    context: fresh
    allowed_tools: [Read, Grep, Glob]

  # ═══════════════════════════════════════════════════════════════
  # PHASE 5: SYNTHESIZE PASS-1 VERDICT
  # ═══════════════════════════════════════════════════════════════

  - id: synthesize-verdict-pass-1
    command: dark-factory-synthesize-verdict
    depends_on:
      # Infrastructure prerequisites — must be present so the synthesizer
      # can detect whether the app actually ran. The synthesizer command
      # (dark-factory-synthesize-verdict.md) checks $checkout-pr.output and
      # $start-app.output and fails closed to reject+escalate if either is
      # empty or missing its success marker. This prevents the validator
      # from rendering an "approve" verdict when checkout-pr crashed and
      # static checks / tests / E2E never ran at all.
      - checkout-pr
      - start-app
      - gate
      - check-protected-paths
      - behavioral-validation-p1
      - behavioral-e2e-p1
      - security-check-p1
      - code-review-p1
      - fetch-base-governance
    trigger_rule: all_done
    context: fresh
    allowed_tools: []
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: ["approve", "request_changes", "reject"] }
        summary: { type: string }
        static_checks_status: { type: string, enum: ["pass", "fail"] }
        tests_status: { type: string, enum: ["pass", "fail", "skipped"] }
        behavioral_status: { type: string, enum: ["yes", "partially", "no"] }
        e2e_status: { type: string, enum: ["yes", "partially", "no", "not_e2e_testable"] }
        security_status: { type: string, enum: ["pass", "fail"] }
        issues_to_fix:
          type: array
          items:
            type: object
            properties:
              category: { type: string, enum: ["behavioral", "test_failure", "static_check", "code_quality", "security", "scope", "e2e"] }
              severity: { type: string, enum: ["critical", "high", "medium", "low"] }
              description: { type: string }
              file: { type: string }
            required: [category, severity, description]
        should_escalate: { type: boolean }
        escalation_reason: { type: string }
        reasoning: { type: string }
      required:
        - verdict
        - summary
        - static_checks_status
        - tests_status
        - behavioral_status
        - e2e_status
        - security_status
        - issues_to_fix
        - should_escalate
        - reasoning

  # ═══════════════════════════════════════════════════════════════
  # PHASE 6: FIX (conditional — runs only when pass-1 says request_changes)
  # ═══════════════════════════════════════════════════════════════
  # Fresh context. The fixer sees synthesize-verdict-pass-1's issues_to_fix
  # and nothing else from prior phases. It reads current source (it has to),
  # applies minimal targeted fixes, runs local validation, commits, and pushes.
  #
  # The fixer's reasoning does NOT leak into Phase 7 reviewers because those
  # nodes also run with context: fresh — they see only the updated diff and
  # the running app, not the fixer's output beyond its commit message.

  - id: fix-issues
    command: dark-factory-fix-pr-issues
    depends_on: [synthesize-verdict-pass-1]
    when: "$synthesize-verdict-pass-1.output.verdict == 'request_changes'"
    context: fresh
    # The fixer needs full tool access — it's the implementer for this phase.

  # ═══════════════════════════════════════════════════════════════
  # PHASE 7: PASS-2 VALIDATION (conditional — runs only if fix-issues ran)
  # ═══════════════════════════════════════════════════════════════
  # Re-runs ALL reviewers on the updated diff. Each one with fresh context —
  # they don't know a fix happened, they only see the code as it now stands
  # and the service as it now runs. harness/serve.py runs uvicorn WITHOUT
  # --reload, so the process started for pass 1 would keep serving the
  # pre-fix code; restart-app-p2 replaces it before the pass-2 E2E reviewer
  # runs.

  - id: fetch-diff-p2
    bash: |
      set -euo pipefail
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number")
      # Pull the latest — the fixer just pushed.
      git fetch origin "refs/pull/$PR_NUMBER/head" --quiet 2>/dev/null || true
      git pull --ff-only 2>/dev/null || true

      # Re-pin: pass 2 gates the fixer's commit, so THAT is the sha
      # apply-verdict is allowed to merge. And assert the remote agrees — if
      # GitHub's head is not what we are about to validate, something else
      # pushed to the branch and pass 2 would be reviewing stale code.
      VALIDATED_SHA=$(git rev-parse HEAD)
      REMOTE_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q '.headRefOid')
      if [ "$REMOTE_SHA" != "$VALIDATED_SHA" ]; then
        echo "ERROR: worktree HEAD $VALIDATED_SHA != PR head $REMOTE_SHA — the fixer did not push, or someone else did. Pass 2 would validate stale code." >&2
        exit 1
      fi
      echo "$VALIDATED_SHA" > "$ARTIFACTS_DIR/.validated-sha"
      echo "VALIDATED_SHA $VALIDATED_SHA"

      gh pr diff "$PR_NUMBER" | head -3000
    depends_on: [fix-issues]
    timeout: 30000

  - id: restart-app-p2
    bash: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      # Kill the pass-1 service (serve.py forwards the signal to uvicorn and
      # shuts the stubs down with it), then start it again on the same port so
      # the pass-2 E2E reviewer drives the fixer's code, not pass 1's.
      if [ -f "$ARTIFACTS_DIR/.backend-pid" ]; then
        kill "$(cat "$ARTIFACTS_DIR/.backend-pid")" 2>/dev/null || true
        sleep 3
      fi
      PYTHON=$(command -v python || command -v python3)
      BACKEND_PORT=$(cat "$ARTIFACTS_DIR/.backend-port")
      LOG="$ARTIFACTS_DIR/app-logs/backend-p2.log"
      nohup "$PYTHON" harness/serve.py --port "$BACKEND_PORT" > "$LOG" 2>&1 &
      BACKEND_PID=$!
      echo "$BACKEND_PID" > "$ARTIFACTS_DIR/.backend-pid"
      HEALTHY="no"
      for i in $(seq 1 90); do
        if curl -sf "http://127.0.0.1:$BACKEND_PORT/api/health" 2>/dev/null | grep -qE '"status": ?"ok"'; then
          echo "backend up after ${i}s"; HEALTHY="yes"; break
        fi
        if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
          echo "ERROR: serve.py (pid $BACKEND_PID) exited before the service came up" >&2
          tail -50 "$LOG" >&2
          exit 1
        fi
        sleep 1
      done
      if [ "$HEALTHY" != "yes" ]; then
        echo "ERROR: backend failed to restart in 90s" >&2
        tail -50 "$LOG" >&2
        exit 1
      fi
      # Same proof as start-app: health alone says only that something answers
      # on this port. Our pid alive plus our own log saying uvicorn finished
      # booting says it is ours — a sibling run that grabbed the port while
      # the pass-1 process was dying would otherwise be judged as this PR.
      if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
        echo "ERROR: health answered but pid $BACKEND_PID is gone — that service belongs to another run" >&2
        exit 1
      fi
      if ! grep -q 'Application startup complete' "$LOG" 2>/dev/null; then
        echo "ERROR: health answered but $LOG never logged 'Application startup complete' — that service is not ours" >&2
        exit 1
      fi
      echo "APP_RESTARTED backend=$BACKEND_PORT pid=$BACKEND_PID"
    depends_on: [fix-issues]
    timeout: 180000

  - id: gate-p2
    bash: |
      set +e
      export PATH="$HOME/.local/bin:$PATH"
      # Same gate, on the fixer's code. apply-verdict reads this one when pass 2 ran.
      PYTHON=$(command -v python || command -v python3)
      "$PYTHON" harness/ci.py > "$ARTIFACTS_DIR/gate-p2.log" 2>&1
      GATE_RC=$?
      # Same reasoning as the pass-1 gate: the ratchet only means anything
      # against a log that ended in GATE_OK. A red gate gets RATCHET_SKIPPED,
      # not RATCHET_FAILED, so the fix pass is reachable for lint and unit.
      if [ $GATE_RC -eq 0 ]; then
        "$PYTHON" harness/ratchet.py "$ARTIFACTS_DIR/gate-p2.log" --base origin/main >> "$ARTIFACTS_DIR/gate-p2.log" 2>&1
        RATCHET_RC=$?
      else
        RATCHET_RC=0
        echo "RATCHET_SKIPPED gate_red" >> "$ARTIFACTS_DIR/gate-p2.log"
      fi
      grep -E '^(HARNESS_START|STATIC_|UNIT_|APP_STARTED|E2E_|HOLDOUT_|MUTATION|GATE_|RATCHET_|  (ok|CAUGHT|ESCAPED|NOT_INJECTED|RATCHET_FAIL|E2E_FAIL|HOLDOUT_FAIL) )' "$ARTIFACTS_DIR/gate-p2.log"
      if [ $GATE_RC -ne 0 ] || [ $RATCHET_RC -ne 0 ]; then
        echo "--- tail of gate-p2.log ---"
        tail -60 "$ARTIFACTS_DIR/gate-p2.log"
      fi
      echo "GATE_NODE_DONE gate_rc=$GATE_RC ratchet_rc=$RATCHET_RC"
      [ $GATE_RC -eq 0 ] && [ $RATCHET_RC -eq 0 ]
    depends_on: [fix-issues]
    timeout: 2400000

  # static-checks-backend-p2 and run-tests-backend-p2 are gone for the same
  # reason their pass-1 twins are: gate-p2 runs ruff, mypy, static_ios and
  # pytest as rungs 1 and 2, and running them again beside its mutation rung
  # reads files the mutation runner is holding open.

  - id: behavioral-validation-p2
    command: dark-factory-behavioral-validation-p2
    depends_on: [fix-issues, fetch-diff-p2, fetch-pr, fetch-linked-issue]
    context: fresh
    allowed_tools: []
    output_format:
      type: object
      properties:
        solves_issue: { type: string, enum: ["yes", "partially", "no"] }
        asks_identified: { type: array, items: { type: string } }
        asks_addressed:  { type: array, items: { type: string } }
        asks_missed:     { type: array, items: { type: string } }
        regressions_detected: { type: array, items: { type: string } }
        scope_appropriate: { type: string, enum: ["yes", "too_narrow", "too_broad"] }
        unrequested_changes: { type: array, items: { type: string } }
        confidence: { type: string, enum: ["high", "medium", "low"] }
        reasoning: { type: string }
      required:
        - solves_issue
        - asks_identified
        - asks_addressed
        - asks_missed
        - regressions_detected
        - scope_appropriate
        - unrequested_changes
        - confidence
        - reasoning

  - id: behavioral-e2e-p2
    command: dark-factory-behavioral-e2e
    depends_on: [fix-issues, fetch-pr, fetch-linked-issue, restart-app-p2]
    context: fresh
    allowed_tools: [Bash]
    output_format:
      type: object
      properties:
        solves_issue: { type: string, enum: ["yes", "partially", "no", "not_e2e_testable"] }
        app_booted: { type: boolean }
        flows_tested: { type: array, items: { type: string } }
        criteria_results:
          type: array
          items:
            type: object
            properties:
              criterion: { type: string }
              result: { type: string, enum: ["pass", "fail", "skip"] }
              evidence: { type: string }
            required: [criterion, result, evidence]
        regressions_observed: { type: array, items: { type: string } }
        evidence_captured: { type: array, items: { type: string } }
        confidence: { type: string, enum: ["high", "medium", "low"] }
        reasoning: { type: string }
      required:
        - solves_issue
        - app_booted
        - flows_tested
        - criteria_results
        - regressions_observed
        - evidence_captured
        - confidence
        - reasoning

  - id: security-check-p2
    command: dark-factory-security-check-p2
    # fetch-pr for the PR body — see the pass-1 node.
    depends_on: [fix-issues, fetch-pr, fetch-diff-p2, fetch-base-governance]
    context: fresh
    allowed_tools: []
    output_format:
      type: object
      properties:
        security_issues:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: ["critical", "high", "medium", "low"] }
              category: { type: string, enum: ["secret", "injection", "dependency", "permission", "governance", "data_exposure"] }
              description: { type: string }
              file: { type: string }
              line: { type: string }
            required: [severity, category, description, file]
        governance_files_modified: { type: boolean }
        protected_files_touched: { type: array, items: { type: string } }
        new_dependencies: { type: array, items: { type: string } }
        new_dependencies_justified: { type: boolean }
        verdict: { type: string, enum: ["pass", "fail"] }
        reasoning: { type: string }
      required:
        - security_issues
        - governance_files_modified
        - protected_files_touched
        - new_dependencies
        - new_dependencies_justified
        - verdict
        - reasoning

  # Same serialisation as pass 1: behind gate-p2, not beside it.
  - id: code-review-p2
    command: archon-code-review-agent
    depends_on: [fix-issues, gate-p2]
    # all_done so a red gate-p2 still gets reviewed (the reviewer's findings
    # are what the fix list is built from); `when` so the node is still
    # skipped outright when pass 1 never asked for a fix, exactly as the
    # other -p2 nodes are.
    trigger_rule: all_done
    when: "$synthesize-verdict-pass-1.output.verdict == 'request_changes'"
    context: fresh
    allowed_tools: [Read, Grep, Glob]

  - id: synthesize-verdict-pass-2
    command: dark-factory-synthesize-verdict-p2
    # Only run when pass-1 actually triggered a fix loop. If pass-1 verdict was
    # approve or reject, the pass-2 reviewer nodes are correctly skipped — and
    # this synthesizer would otherwise see all-empty inputs and panic-render an
    # escalation. The when condition here mirrors fix-issues so the two stay
    # in sync.
    when: "$synthesize-verdict-pass-1.output.verdict == 'request_changes'"
    depends_on:
      - restart-app-p2
      - gate-p2
      - check-protected-paths
      - behavioral-validation-p2
      - behavioral-e2e-p2
      - security-check-p2
      - code-review-p2
      - fetch-base-governance
    trigger_rule: all_done
    context: fresh
    allowed_tools: []
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: ["approve", "request_changes", "reject"] }
        summary: { type: string }
        static_checks_status: { type: string, enum: ["pass", "fail"] }
        tests_status: { type: string, enum: ["pass", "fail", "skipped"] }
        behavioral_status: { type: string, enum: ["yes", "partially", "no"] }
        e2e_status: { type: string, enum: ["yes", "partially", "no", "not_e2e_testable"] }
        security_status: { type: string, enum: ["pass", "fail"] }
        issues_to_fix:
          type: array
          items:
            type: object
            properties:
              category: { type: string, enum: ["behavioral", "test_failure", "static_check", "code_quality", "security", "scope", "e2e"] }
              severity: { type: string, enum: ["critical", "high", "medium", "low"] }
              description: { type: string }
              file: { type: string }
            required: [category, severity, description]
        should_escalate: { type: boolean }
        escalation_reason: { type: string }
        reasoning: { type: string }
      required:
        - verdict
        - summary
        - static_checks_status
        - tests_status
        - behavioral_status
        - e2e_status
        - security_status
        - issues_to_fix
        - should_escalate
        - reasoning

  # ═══════════════════════════════════════════════════════════════
  # PHASE 8: TEARDOWN (always runs)
  # ═══════════════════════════════════════════════════════════════

  - id: teardown-app
    bash: |
      set +e
      if [ -f "$ARTIFACTS_DIR/.backend-pid" ]; then
        BACKEND_PID=$(cat "$ARTIFACTS_DIR/.backend-pid")
        kill "$BACKEND_PID" 2>/dev/null && echo "killed backend PID $BACKEND_PID" || echo "backend already dead"
      fi
      echo "TEARDOWN_COMPLETE"
    depends_on: [synthesize-verdict-pass-1, synthesize-verdict-pass-2]
    trigger_rule: all_done
    timeout: 30000

  # ═══════════════════════════════════════════════════════════════
  # PHASE 9: APPLY FINAL VERDICT (deterministic bash)
  # ═══════════════════════════════════════════════════════════════
  # Reads whichever synthesize node ran last: if pass-2 ran, use its verdict;
  # otherwise use pass-1. All approve/reject/label operations are pure gh calls
  # — no AI decisions here. Keeps the auto-merge audit trail reproducible.

  - id: apply-verdict
    bash: |
      set -euo pipefail
      PR_NUMBER=$(cat "$ARTIFACTS_DIR/.pr-number")

      # Capture the synthesizer outputs to disk. Archon substitutes
      # $node-id.output before bash runs, wrapping the value in single
      # quotes with '\'' for embedded apostrophes. Heredoc captures the
      # raw value; Python cleans quote-wrapping and '\'' escaping so jq
      # can parse it as valid JSON.
      cat > "$ARTIFACTS_DIR/p1-verdict.json" <<'__P1_VERDICT_EOF__'
      $synthesize-verdict-pass-1.output
      __P1_VERDICT_EOF__
      cat > "$ARTIFACTS_DIR/p2-verdict.json" <<'__P2_VERDICT_EOF__'
      $synthesize-verdict-pass-2.output
      __P2_VERDICT_EOF__
      for vf in "$ARTIFACTS_DIR/p1-verdict.json" "$ARTIFACTS_DIR/p2-verdict.json"; do
        [ -f "$vf" ] && python3 -c "import sys,pathlib;p=pathlib.Path(sys.argv[1]);t=p.read_text().strip();t=t.strip(chr(39));t=t.replace(chr(39)+chr(92)+chr(39)+chr(39),chr(39));p.write_text(t)" "$vf"
      done

      # Pick the authoritative verdict. If pass-2 ran (i.e., fix happened),
      # it's authoritative. Otherwise use pass-1.
      if [ -s "$ARTIFACTS_DIR/p2-verdict.json" ] && jq -e '.verdict' "$ARTIFACTS_DIR/p2-verdict.json" > /dev/null 2>&1; then
        VERDICT_FILE="$ARTIFACTS_DIR/p2-verdict.json"
        PASS_LABEL="pass-2"
      else
        VERDICT_FILE="$ARTIFACTS_DIR/p1-verdict.json"
        PASS_LABEL="pass-1"
      fi

      # Defensive: if the selected verdict file is empty or unparseable,
      # an upstream node (checkout-pr, start-app, synthesize-verdict-*)
      # failed and its output substitution resolved to nothing. The
      # downstream jq / case logic assumes a well-formed object, so without
      # this guard apply-verdict hits secondary parse errors and the broken
      # run leaves the PR in a stuck state. Write a hardcoded fallback
      # verdict that routes to the reject+escalate branch — this leaves
      # the PR OPEN with factory:needs-human so a human can investigate
      # the underlying validator failure.
      if [ ! -s "$VERDICT_FILE" ] || ! jq -e '.verdict' "$VERDICT_FILE" > /dev/null 2>&1; then
        echo "WARN: verdict file ($VERDICT_FILE) is empty or unparseable - emitting fallback reject+escalate" >&2
        # Single-line printf (not heredoc) on purpose. Archon spawns this
        # node via bash -c "$payload" on Windows, and multi-line heredocs
        # with non-tabbed end markers fail to match their delimiter across
        # that serialization boundary (discovered empirically — the P1/P2
        # heredocs above work because their substituted bodies are one line).
        printf '%s\n' '{"verdict":"reject","summary":"Validator infrastructure failed - no synthesizer output available. Manual investigation required.","static_checks_status":"fail","tests_status":"fail","behavioral_status":"no","security_status":"fail","issues_to_fix":[],"should_escalate":true,"escalation_reason":"Upstream node (checkout-pr, start-app, or synthesize-verdict) failed and produced no verdict. Validator cannot render a substantive decision; human must investigate the broken run.","reasoning":"Fallback verdict emitted by apply-verdict because the selected verdict file was empty or unparseable JSON. This indicates an upstream infrastructure failure, not a defect in the PR under review."}' > "$VERDICT_FILE"
      fi

      cp "$VERDICT_FILE" "$ARTIFACTS_DIR/verdict.json"
      VERDICT_JSON=$(cat "$VERDICT_FILE")

      DECISION=$(echo "$VERDICT_JSON" | jq -r '.verdict')
      SUMMARY=$(echo "$VERDICT_JSON" | jq -r '.summary')
      SHOULD_ESCALATE=$(echo "$VERDICT_JSON" | jq -r '.should_escalate')
      ESCALATION_REASON=$(echo "$VERDICT_JSON" | jq -r '.escalation_reason // empty')
      ISSUES=$(echo "$VERDICT_JSON" | jq -r '
        .issues_to_fix
        | map("- **\(.severity)** [\(.category)]\(if .file then " (`\(.file)`)" else "" end): \(.description)")
        | join("\n")')

      # ──────────────────────────────────────────────────────────────────
      # DETERMINISTIC INFRASTRUCTURE BACKSTOP
      # ──────────────────────────────────────────────────────────────────
      # The synthesize-verdict command file has a "rule 0" that says any
      # validation run where start-app never emitted APP_STARTED must render
      # reject+escalate (see dark-factory-synthesize-verdict.md). That rule
      # was empirically ignored at least once — the AI returned
      # e2e_status: "not_e2e_testable" and verdict: "approve" while the
      # backend had crashed at import with `RuntimeError: DATABASE_URL is
      # not set`. An auto-merged PR that was never actually driven through the
      # API journey is exactly the failure mode FACTORY_RULES §4 exists
      # to prevent, so rule-0 needs a non-AI enforcement layer.
      #
      # This block is that layer: deterministic bash reads start-app's
      # output directly and flips any approve → reject+escalate when the
      # APP_STARTED marker is absent. Keep it simple — one marker, one
      # grep, one override. Anything more elaborate invites new bugs.
      cat > "$ARTIFACTS_DIR/.start-app-output" <<'__START_APP_OUTPUT_EOF__'
      $start-app.output
      __START_APP_OUTPUT_EOF__
      if grep -q "APP_STARTED" "$ARTIFACTS_DIR/.start-app-output"; then
        APP_DID_START="true"
      else
        APP_DID_START="false"
      fi
      echo "INFRA_BACKSTOP: app_did_start=$APP_DID_START decision=$DECISION"

      if [ "$DECISION" = "approve" ] && [ "$APP_DID_START" != "true" ]; then
        echo "INFRA_BACKSTOP_OVERRIDE: start-app did not emit APP_STARTED but synthesizer rendered approve — overriding to reject+escalate." >&2
        DECISION="reject"
        SHOULD_ESCALATE="true"
        ESCALATION_REASON="Deterministic infrastructure backstop fired: start-app output lacked the APP_STARTED marker, so no end-to-end journey could have actually run against a live service. The synthesize-verdict node rendered an approve verdict anyway (rule 0 of dark-factory-synthesize-verdict.md was not honored). A human must investigate both the infrastructure failure (check \$ARTIFACTS_DIR/app-logs/backend.log; harness/serve.py names what it refused on) and the synthesizer's failure to catch it."
        SUMMARY="Infrastructure backstop override: start-app never reached APP_STARTED, so the end-to-end journey required by FACTORY_RULES §3 and §4 could not have run. Auto-approve blocked."
        ISSUES=$(printf '%s\n' \
          "- **critical** [e2e]: start-app node did not emit APP_STARTED — the service failed to boot and the mandatory end-to-end journey never ran." \
          "- **critical** [e2e]: synthesize-verdict rendered approve despite the missing APP_STARTED marker — review why rule 0 of the synthesize-verdict command did not fire.")
      fi
      # ──────────────────────────────────────────────────────────────────

      # ──────────────────────────────────────────────────────────────────
      # THE GATE BACKSTOP - same shape, one more marker.
      # ──────────────────────────────────────────────────────────────────
      # The `gate` node (or `gate-p2` when a fix pass ran) is harness/ci.py plus
      # harness/ratchet.py: static, unit, the journey, the holdout, the mutation
      # set, the floors. Its marker lines are its output. No GATE_OK and
      # RATCHET_OK in there means the build is not good, whatever a reviewer
      # concluded from the diff - so any approve becomes reject+escalate here,
      # in bash, before a single gh call.
      cat > "$ARTIFACTS_DIR/.gate-output" <<'__GATE_OUTPUT_EOF__'
      $gate.output
      __GATE_OUTPUT_EOF__
      cat > "$ARTIFACTS_DIR/.gate-p2-output" <<'__GATE_P2_OUTPUT_EOF__'
      $gate-p2.output
      __GATE_P2_OUTPUT_EOF__
      if [ "$PASS_LABEL" = "pass-2" ]; then
        GATE_FILE="$ARTIFACTS_DIR/.gate-p2-output"
      else
        GATE_FILE="$ARTIFACTS_DIR/.gate-output"
      fi
      if grep -qE '^\s*GATE_OK mode=full' "$GATE_FILE" && grep -qE '^\s*RATCHET_OK' "$GATE_FILE"; then
        GATE_GREEN="true"
      else
        GATE_GREEN="false"
      fi
      echo "GATE_BACKSTOP: gate_green=$GATE_GREEN pass=$PASS_LABEL decision=$DECISION"

      if [ "$DECISION" = "approve" ] && [ "$GATE_GREEN" != "true" ]; then
        echo "GATE_BACKSTOP_OVERRIDE: the gate did not report GATE_OK and RATCHET_OK but the synthesizer rendered approve - overriding to reject+escalate." >&2
        DECISION="reject"
        SHOULD_ESCALATE="true"
        ESCALATION_REASON="Deterministic gate backstop fired: harness/ci.py plus harness/ratchet.py did not end in GATE_OK and RATCHET_OK for ${PASS_LABEL}, so at least one of static, unit, the FACTORY_RULES §4 journey, the holdout, the mutation set or a ratchet floor is red. The synthesizer rendered approve anyway. Read \$ARTIFACTS_DIR/gate.log (or gate-p2.log) for the rung that failed."
        SUMMARY="Gate backstop override: the harness did not report GATE_OK and RATCHET_OK, so the quality gates in FACTORY_RULES §3 (1-6) are not all green. Auto-approve blocked."
        ISSUES=$(printf '%s\n' \
          "- **critical** [e2e]: python harness/ci.py did not end in GATE_OK, or harness/ratchet.py did not end in RATCHET_OK - see gate.log in the run artifacts." \
          "- **critical** [e2e]: synthesize-verdict rendered approve despite a red gate - review why the gate node's output was not weighed.")
      fi
      # ──────────────────────────────────────────────────────────────────

      # ──────────────────────────────────────────────────────────────────
      # THE PROTECTED-PATH AND SIZE BACKSTOP - same shape, two more markers.
      # ──────────────────────────────────────────────────────────────────
      # FACTORY_RULES §5 (protected files) and §8 (500 lines) were, until
      # this node existed, enforced only by a model reading a diff that
      # `head -3000` may have truncated, against a list copied into five
      # files that had drifted apart. check-protected-paths reads the PR's
      # file list from the API and matches it against .factory/protected-paths.txt,
      # the one machine-readable copy. Absent markers mean the check did not
      # run, which is treated exactly like a violation: no approve without a
      # positive PROTECTED_CLEAN and SIZE_OK.
      cat > "$ARTIFACTS_DIR/.protected-output" <<'__PROTECTED_OUTPUT_EOF__'
      $check-protected-paths.output
      __PROTECTED_OUTPUT_EOF__
      if grep -q "PROTECTED_CLEAN" "$ARTIFACTS_DIR/.protected-output" && \
         grep -q "SIZE_OK" "$ARTIFACTS_DIR/.protected-output"; then
        SCOPE_CLEAN="true"
      else
        SCOPE_CLEAN="false"
      fi
      TOUCHED=$(grep -oE 'PROTECTED_TOUCHED path=[^ ]+' "$ARTIFACTS_DIR/.protected-output" | sed 's/^PROTECTED_TOUCHED path=//' | paste -sd ' ' - 2>/dev/null || echo "")
      SIZE_LINE=$(grep -oE 'SIZE_(OK|EXCEEDED)[^ ]*.*' "$ARTIFACTS_DIR/.protected-output" | head -1 || echo "(no size marker)")
      echo "SCOPE_BACKSTOP: scope_clean=$SCOPE_CLEAN touched='$TOUCHED' size='$SIZE_LINE' decision=$DECISION"

      if [ "$DECISION" = "approve" ] && [ "$SCOPE_CLEAN" != "true" ]; then
        echo "SCOPE_BACKSTOP_OVERRIDE: check-protected-paths did not report both PROTECTED_CLEAN and SIZE_OK but the synthesizer rendered approve - overriding to reject+escalate." >&2
        DECISION="reject"
        SHOULD_ESCALATE="true"
        ESCALATION_REASON="Deterministic scope backstop fired: the PR touched a path in .factory/protected-paths.txt (${TOUCHED:-none listed}), exceeded the 500-line cap (${SIZE_LINE}), or the check itself could not run. FACTORY_RULES §5 makes a protected-path change human-authored by definition and §7 escalates the issue with it, because a factory PR reaching for those files means the scope was misunderstood."
        SUMMARY="Scope backstop override: FACTORY_RULES §5 (protected files) or §8 (500-line cap) was not satisfied, so auto-approve is blocked regardless of what the reviewers concluded."
        ISSUES=$(printf '%s\n' \
          "- **critical** [scope]: the PR changed a protected path or exceeded the size cap - ${TOUCHED:-see check-protected-paths output}; ${SIZE_LINE}." \
          "- **critical** [scope]: synthesize-verdict rendered approve despite it - review why check-protected-paths' markers were not weighed.")
      fi
      # ──────────────────────────────────────────────────────────────────

      # GitHub forbids reviewing your own PR (addPullRequestReview GraphQL error).
      # When the bot identity authored the PR, fall back to posting a regular
      # comment so the verdict is still visible. Labels and merge actions still
      # run normally — only the formal review API call is swapped.
      PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author -q '.author.login' 2>/dev/null || echo "")
      BOT_LOGIN=$(gh api user -q '.login' 2>/dev/null || echo "")
      SELF_REVIEW="false"
      if [ -n "$PR_AUTHOR" ] && [ "$PR_AUTHOR" = "$BOT_LOGIN" ]; then
        SELF_REVIEW="true"
        echo "Self-review detected (PR author '$PR_AUTHOR' == bot '$BOT_LOGIN'); will post as comment instead of formal review."
      fi

      # post_review <review-flag> <body>  — review-flag is --approve/--request-changes/--comment.
      # In self-review mode, always falls back to `gh pr comment`.
      post_review() {
        local flag="$1"
        local body="$2"
        if [ "$SELF_REVIEW" = "true" ]; then
          gh pr comment "$PR_NUMBER" --body "$body"
        else
          gh pr review "$PR_NUMBER" "$flag" --body "$body"
        fi
      }

      # Multi-line PR/issue bodies are built via printf so every source line stays
      # inside the YAML block scalar's indent column (column-0 lines would terminate
      # the block early and cause a YAML parse error).

      case "$DECISION" in
        approve)
          BODY=$(printf '%s\n' \
            "**Dark Factory Validation**: APPROVED (${PASS_LABEL})" \
            "" \
            "${SUMMARY}" \
            "" \
            "All quality gates passed:" \
            "- Gate: python harness/ci.py GATE_OK + harness/ratchet.py RATCHET_OK (static, unit, journey, holdout, mutations, floors)" \
            "- Behavioral (static): solves_issue=yes" \
            "- Behavioral (E2E through the API): solves_issue=yes" \
            "- Security: pass (no governance files modified)" \
            "- Static checks: pass" \
            "- Tests: pass or legitimately skipped" \
            "- Code review: no critical/high findings" \
            "" \
            "Auto-merging via squash.")
          post_review --approve "$BODY"
          # The PR may have been opened as a draft by the implementer workflow.
          # Mark it ready before merging — draft PRs cannot be merged at all.
          IS_DRAFT=$(gh pr view "$PR_NUMBER" --json isDraft -q '.isDraft' 2>/dev/null || echo "false")
          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is draft — marking ready for review before merge"
            gh pr ready "$PR_NUMBER"
          fi
          # Plain squash merge (no --auto). The validator IS the gate — by the
          # time we reach this branch, every quality gate has already passed,
          # so we don't need GitHub branch-protection rules to hold the merge
          # until checks finish. Dropping --auto also means we don't need the
          # repo to have branch protection configured at all.
          # Don't pass --delete-branch: gh tries to delete the local branch
          # after merging, which requires switching off it. In a worktree
          # where main is checked out elsewhere, that switch fails and aborts
          # apply-verdict (set -e) before the label swap runs. Repos with
          # "Automatically delete head branches" enabled handle deletion
          # server-side anyway.
          # Merge the commit that was actually gated, or nothing.
          # Between checkout-pr and here sit a 40-minute gate and possibly a
          # fix pass; a push in that window (the fixer, the builder's own
          # post-label self-fix, a human) would otherwise land ungated code
          # under a review claiming every gate passed. `--match-head-commit`
          # makes GitHub refuse the merge if the head moved; the explicit
          # comparison first turns that into a readable message instead of a
          # bare API error.
          VALIDATED_SHA=$(cat "$ARTIFACTS_DIR/.validated-sha" 2>/dev/null || echo "")
          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q '.headRefOid' 2>/dev/null || echo "")
          if [ -z "$VALIDATED_SHA" ]; then
            echo "WARN: no .validated-sha recorded — refusing to merge PR #$PR_NUMBER; leaving approved for manual merge" >&2
          elif [ "$VALIDATED_SHA" != "$CURRENT_SHA" ]; then
            echo "WARN: PR #$PR_NUMBER head moved since validation (gated $VALIDATED_SHA, now $CURRENT_SHA) — refusing to merge unvalidated code" >&2
            gh pr comment "$PR_NUMBER" --body "**Dark Factory Validation**: approved ${VALIDATED_SHA}, but the branch head is now ${CURRENT_SHA}. The merge was refused: only the commit the gate exercised may land. Re-run validation on the new head." 2>/dev/null || true
          elif gh pr merge "$PR_NUMBER" --squash --match-head-commit "$VALIDATED_SHA"; then
            echo "PR #$PR_NUMBER: merged via squash at $VALIDATED_SHA"
          else
            echo "WARN: squash merge failed for PR #$PR_NUMBER — leaving approved for manual merge" >&2
          fi
          gh pr edit "$PR_NUMBER" --remove-label "factory:needs-review" --add-label "factory:approved" 2>/dev/null || true
          echo "PR #$PR_NUMBER: APPROVED (${PASS_LABEL})"
          ;;

        request_changes)
          # If pass-2 still says request_changes, we've exhausted autonomous fix attempts -> escalate.
          if [ "$PASS_LABEL" = "pass-2" ] || [ "$SHOULD_ESCALATE" = "true" ]; then
            BODY=$(printf '%s\n' \
              "**Dark Factory Validation**: ESCALATED TO HUMAN (${PASS_LABEL})" \
              "" \
              "${SUMMARY}" \
              "" \
              "### Escalation reason" \
              "${ESCALATION_REASON:-Autonomous fix pass did not resolve all blocking issues. Human review required.}" \
              "" \
              "### Issues remaining" \
              "${ISSUES}")
            post_review --request-changes "$BODY"
            gh pr edit "$PR_NUMBER" --remove-label "factory:needs-review" --add-label "factory:needs-human" 2>/dev/null || true
            echo "PR #$PR_NUMBER: ESCALATED to human after ${PASS_LABEL}"
          else
            # pass-1 said request_changes but somehow fix didn't run — shouldn't happen.
            BODY=$(printf '%s\n' \
              "**Dark Factory Validation**: Changes Requested (${PASS_LABEL})" \
              "" \
              "${SUMMARY}" \
              "" \
              "### Issues to fix" \
              "${ISSUES}")
            post_review --request-changes "$BODY"
            gh pr edit "$PR_NUMBER" --remove-label "factory:needs-review" --add-label "factory:needs-fix" 2>/dev/null || true
            echo "PR #$PR_NUMBER: CHANGES REQUESTED (${PASS_LABEL})"
          fi
          ;;

        reject)
          # Two reject sub-cases:
          #   (a) Escalated reject (should_escalate=true): validator itself
          #       flagged something humans must look at. Includes rule-0
          #       infrastructure failures and rule-7 hard-invariant breaches.
          #       PR stays OPEN and gets labeled factory:needs-human. Issue
          #       also gets factory:needs-human. Don't close anything —
          #       a human needs to see the PR diff to investigate.
          #   (b) Normal reject (should_escalate=false): PR is fundamentally
          #       wrong (bad approach, scope creep, security fail). Close the
          #       PR, re-queue the underlying issue for another attempt.
          if [ "$SHOULD_ESCALATE" = "true" ]; then
            BODY=$(printf '%s\n' \
              "**Dark Factory Validation**: REJECTED + ESCALATED (${PASS_LABEL})" \
              "" \
              "${SUMMARY}" \
              "" \
              "### Escalation reason" \
              "${ESCALATION_REASON}" \
              "" \
              "### Findings" \
              "${ISSUES}" \
              "" \
              "This PR is NOT being closed — a human needs to investigate.")
            post_review --request-changes "$BODY"
            gh pr edit "$PR_NUMBER" --remove-label "factory:needs-review" --add-label "factory:needs-human" 2>/dev/null || true

            ISSUE_NUM=$(gh pr view "$PR_NUMBER" --json body -q '.body' \
              | grep -oiE '(fixes|closes|resolves) #[0-9]+' \
              | grep -oE '[0-9]+' | head -1)
            if [ -n "$ISSUE_NUM" ]; then
              gh issue edit "$ISSUE_NUM" --add-label "factory:needs-human" 2>/dev/null || true
              ICOMMENT=$(printf '%s\n' \
                "**Dark Factory**: PR #$PR_NUMBER was rejected and escalated to human review (${PASS_LABEL})." \
                "" \
                "Reason: ${SUMMARY}" \
                "" \
                "${ESCALATION_REASON}")
              gh issue comment "$ISSUE_NUM" --body "$ICOMMENT"
            fi
            echo "PR #$PR_NUMBER: REJECTED+ESCALATED (${PASS_LABEL}) — left open for human review"
          else
            BODY=$(printf '%s\n' \
              "**Dark Factory Validation**: REJECTED (${PASS_LABEL})" \
              "" \
              "${SUMMARY}" \
              "" \
              "### Blocking issues" \
              "${ISSUES}" \
              "" \
              "This PR cannot be fixed incrementally and has been closed.")
            post_review --request-changes "$BODY"
            gh pr close "$PR_NUMBER"

            ISSUE_NUM=$(gh pr view "$PR_NUMBER" --json body -q '.body' \
              | grep -oiE '(fixes|closes|resolves) #[0-9]+' \
              | grep -oE '[0-9]+' | head -1)
            if [ -n "$ISSUE_NUM" ]; then
              gh issue reopen "$ISSUE_NUM" 2>/dev/null || true
              gh issue edit "$ISSUE_NUM" --add-label "factory:accepted" --remove-label "factory:in-progress" 2>/dev/null || true
              ICOMMENT=$(printf '%s\n' \
                "**Dark Factory**: PR #$PR_NUMBER was rejected during validation (${PASS_LABEL}). Issue re-queued for another implementation attempt." \
                "" \
                "Reason: ${SUMMARY}")
              gh issue comment "$ISSUE_NUM" --body "$ICOMMENT"
            fi
            echo "PR #$PR_NUMBER: REJECTED (${PASS_LABEL}) and closed"
          fi
          ;;

        *)
          echo "ERROR: Unknown verdict '$DECISION' from ${PASS_LABEL}" >&2
          exit 1
          ;;
      esac
    # check-protected-paths is listed so its markers are substitutable here.
    # It always exits 0 by design, so it can never skip this node and leave
    # a PR labelled factory:needs-review with no verdict.
    depends_on: [teardown-app, check-protected-paths]
    trigger_rule: all_done
    timeout: 30000
