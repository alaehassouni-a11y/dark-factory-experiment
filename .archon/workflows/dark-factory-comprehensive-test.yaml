name: dark-factory-comprehensive-test
description: |
  Use when: Weekly cron fires a full end-to-end regression against `main` of
            the dark-factory-experiment repo. NOT triggered by the 4-hour
            orchestrator - runs on its own separate schedule.
  Triggers: Weekly cron (0 6 * * 1 UTC), or manual "run comprehensive test".
  Does: Checks out main -> starts the Virtual Agent service on a dynamic
        free port against stub providers -> runs 4 API scenarios sequentially
        against the running service (session and greeting, wiki coverage,
        web fallback, language following and privacy) ->
        tears down -> synthesizes a report -> auto-files GitHub issues on
        failures (with dedup) so triage picks them up and the factory
        heals itself.
  NOT for: Per-PR validation (dark-factory-validate-pr), triage
           (dark-factory-triage), issue implementation
           (dark-factory-fix-github-issue).

  =====================================================================
  WHY THIS EXISTS - the self-healing loop
  =====================================================================

  This workflow closes the feedback loop that makes the Dark Factory actually
  self-evolving: comprehensive test finds a regression in running code -> files
  a GitHub issue with evidence -> triage accepts it -> fix-github-issue opens
  a PR -> validate-pr holds it out -> merge. No human in the loop unless all
  of that fails.

  Unlike validate-pr, this workflow is NOT bound by the holdout principle -
  it runs against main (which is already merged code), so there's nothing to
  hold out from. It can read anything, run anything, and its only output is
  "did this feature still work when I exercised it through the API the iOS
  app is written against?" (`docs/API.md`).

  Prerequisite: `uv` on PATH and a `python` that can run `harness/serve.py`.
  The iOS app cannot run on the factory's machines, so every scenario drives
  the service with `curl`: open a session, send turns, read the SSE stream
  and the transcript.

  =====================================================================
  TEST FIXTURES (locked)
  =====================================================================

  `harness/serve.py` starts the service against `harness/fixtures/wiki`
  (opening hours in English and French, a returns policy) and stub
  providers (a deterministic OpenAI-shaped model, a Brave-shaped search).
  The wiki-coverage scenario asks about opening hours and expects source
  `wiki`; the web-fallback scenario asks something the wiki cannot answer
  ("Wer hat die Mona Lisa gemalt?") and expects source `web`. Do NOT
  change the fixture wiki without updating both scenario command files.

provider: claude
model: sonnet

nodes:
  # =====================================================================
  # PHASE 1: SETUP - checkout main, install deps, start the service
  # =====================================================================

  - id: pull-latest
    bash: |
      set -euo pipefail
      # Snap this worktree's file content to origin/main's tip.
      #
      # We deliberately do NOT `git checkout main` here. Archon spawns this
      # workflow in a *linked* worktree, and the user's main working tree
      # already holds branch `main` - git refuses to have the same branch
      # checked out in two worktrees at once, so the checkout fails with:
      #   fatal: 'main' is already used by worktree at '...'
      # The validate-pr workflow's stale-worktree-prune pattern doesn't
      # apply here either: it searches for worktrees holding a PR branch
      # (which only Archon ever checks out), but `main` is legitimately
      # held by the user's primary clone. We must NEVER force-remove that.
      #
      # Fetch + hard-reset gives us main's exact file content without ever
      # needing to flip HEAD onto the `main` branch. We intentionally do
      # not `git clean -fd .archon/` - that line was wiping the in-flight
      # workflow YAML from the Archon worktree itself. `git reset --hard`
      # already restores tracked files to origin/main, which is all we
      # need.
      git fetch origin main --quiet
      git reset --hard origin/main
      echo "Reset to origin/main at $(git rev-parse --short HEAD)"
    timeout: 60000

  - id: allocate-ports
    bash: |
      set -euo pipefail
      # The service is one FastAPI process and its only client is the iOS
      # app, so nothing on this machine hardcodes its port. Pick a free one
      # so a concurrent validate-pr run never collides; every scenario
      # reads it from the artifact file.
      find_free_port() {
        local start=$1 end=$2
        for port in $(seq $start $end); do
          if ! (echo >/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
            echo $port; return 0
          fi
        done
        echo "ERROR: no free port in range $start-$end" >&2; return 1
      }
      BACKEND_PORT=$(find_free_port 16100 16999)

      echo "$BACKEND_PORT" > "$ARTIFACTS_DIR/.backend-port"
      echo "Allocated backend=$BACKEND_PORT"
    depends_on: [pull-latest]
    timeout: 10000

  - id: install-deps
    bash: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      echo "=== Backend deps (uv sync) ==="
      (cd app/backend && uv sync --all-extras 2>&1 | tail -10)
    depends_on: [pull-latest]
    idle_timeout: 300000

  - id: start-app
    bash: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"

      # `harness/serve.py` is the ONLY way the factory starts the service for
      # validation. It boots stub providers (an OpenAI-shaped model and a
      # Brave-shaped search) on a free port, points the service at them and
      # at `harness/fixtures/wiki` through the same environment variables
      # production uses, then runs uvicorn as a child that dies with it. No
      # secrets, no network, no env file: the whole journey in docs/API.md
      # runs against stubs, so this node needs nothing from the VPS. It
      # refuses loudly (APP_START_REFUSED) when `uv` is missing.
      PYTHON=$(command -v python || command -v python3)

      # Normal path: the port comes from allocate-ports via artifacts.
      # Demo/manual path: if the port file is missing (someone ran this node
      # in isolation), allocate one the same way and write it so downstream
      # nodes that read the file still work.
      if [ -f "$ARTIFACTS_DIR/.backend-port" ]; then
        BACKEND_PORT=$(cat "$ARTIFACTS_DIR/.backend-port")
      else
        find_free_port() {
          local start=$1 end=$2
          for port in $(seq $start $end); do
            if ! (echo >/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
              echo $port; return 0
            fi
          done
          echo "ERROR: no free port in range $start-$end" >&2; return 1
        }
        BACKEND_PORT=$(find_free_port 16100 16999)
        echo "$BACKEND_PORT" > "$ARTIFACTS_DIR/.backend-port"
        echo "WARN: .backend-port missing, allocated $BACKEND_PORT" >&2
      fi

      mkdir -p "$ARTIFACTS_DIR/app-logs"

      # Service + stub providers, in the background, logs to artifacts.
      nohup "$PYTHON" harness/serve.py --port "$BACKEND_PORT" > "$ARTIFACTS_DIR/app-logs/backend.log" 2>&1 &
      echo $! > "$ARTIFACTS_DIR/.backend-pid"

      # Wait for health. The service answers GET /api/health with
      # {"status":"ok",...} once the wiki has loaded (boot can take a
      # while on a cold worktree: uv resolves the venv first).
      echo "Waiting for backend on :$BACKEND_PORT ..."
      for i in $(seq 1 90); do
        if curl -sf "http://127.0.0.1:$BACKEND_PORT/api/health" 2>/dev/null | grep -qE '"status": ?"ok"'; then
          echo "backend up after ${i}s"; break
        fi
        if [ $i -eq 90 ]; then
          echo "ERROR: backend failed to start in 90s" >&2
          tail -50 "$ARTIFACTS_DIR/app-logs/backend.log" >&2
          exit 1
        fi
        sleep 1
      done

      echo "APP_STARTED backend=$BACKEND_PORT"
    depends_on: [install-deps, allocate-ports]
    idle_timeout: 180000

  # =====================================================================
  # PHASE 2: SCENARIO TESTS (sequential, one service, shared stub counters)
  # =====================================================================
  # All four scenarios drive the same running service with curl. The stub
  # providers count their calls globally and the daily turn cap is counted
  # per client_id, so scenarios run sequentially in a chain and each opens
  # its own sessions with its own client_id. Latency is irrelevant - this
  # is a weekly run.
  #
  # Each scenario node:
  #   - runs in fresh context (no knowledge of other scenarios)
  #   - has allowed_tools: [Bash] (curl against docs/API.md; no source reads)
  #   - outputs structured JSON via output_format
  #   - writes $ARTIFACTS_DIR/test-<name>.md as human-readable evidence
  #   - saves at least one raw response body under $ARTIFACTS_DIR/test-<name>-*.txt

  - id: test-chat-ui
    command: dark-factory-test-chat-ui
    depends_on: [start-app]
    context: fresh
    idle_timeout: 300000
    output_format:
      type: object
      properties:
        status: { type: string, enum: ["pass", "fail"] }
        summary: { type: string }
        evidence: { type: array, items: { type: string } }
        failure_reason: { type: ["string", "null"] }
      required: [status, summary, evidence, failure_reason]

  - id: test-video-ingestion
    command: dark-factory-test-video-ingestion
    depends_on: [test-chat-ui]
    context: fresh
    idle_timeout: 600000
    output_format:
      type: object
      properties:
        status: { type: string, enum: ["pass", "fail"] }
        summary: { type: string }
        evidence: { type: array, items: { type: string } }
        failure_reason: { type: ["string", "null"] }
      required: [status, summary, evidence, failure_reason]

  - id: test-rag-response
    command: dark-factory-test-rag-response
    depends_on: [test-video-ingestion]
    context: fresh
    idle_timeout: 300000
    output_format:
      type: object
      properties:
        status: { type: string, enum: ["pass", "fail"] }
        summary: { type: string }
        evidence: { type: array, items: { type: string } }
        failure_reason: { type: ["string", "null"] }
      required: [status, summary, evidence, failure_reason]

  - id: test-conversation-history
    command: dark-factory-test-conversation-history
    depends_on: [test-rag-response]
    context: fresh
    idle_timeout: 300000
    output_format:
      type: object
      properties:
        status: { type: string, enum: ["pass", "fail"] }
        summary: { type: string }
        evidence: { type: array, items: { type: string } }
        failure_reason: { type: ["string", "null"] }
      required: [status, summary, evidence, failure_reason]

  # =====================================================================
  # PHASE 3: TEARDOWN - must always run (trigger_rule: all_done)
  # =====================================================================

  - id: teardown
    bash: |
      set +e
      if [ -f "$ARTIFACTS_DIR/.backend-pid" ]; then
        BACKEND_PID=$(cat "$ARTIFACTS_DIR/.backend-pid")
        # serve.py forwards SIGTERM to its uvicorn child and shuts the stub
        # providers down with it, so one kill tears down the whole stack.
        kill "$BACKEND_PID" 2>/dev/null && echo "killed backend PID $BACKEND_PID" || echo "backend already dead"
      fi
      echo "TEARDOWN_COMPLETE"
    depends_on:
      - test-chat-ui
      - test-video-ingestion
      - test-rag-response
      - test-conversation-history
    trigger_rule: all_done
    timeout: 30000

  # =====================================================================
  # PHASE 4: REPORT + FILE ISSUES
  # =====================================================================

  - id: report
    command: dark-factory-comprehensive-report
    depends_on: [teardown]
    context: fresh
    idle_timeout: 180000

  - id: file-issues
    depends_on: [report]
    bash: |
      set -euo pipefail
      REPORT="$ARTIFACTS_DIR/comprehensive-test-report.md"
      if [ ! -f "$REPORT" ]; then
        echo "ERROR: report file missing at $REPORT" >&2
        exit 1
      fi

      # Infra-failure guard (belt-and-suspenders with the report prompt).
      # If fewer than 4 test-*.md files exist, the scenario nodes were
      # skipped (an upstream node failed) and any "failures" the report
      # enumerates are fabricated - the synthesizer saw missing files and
      # called them FAIL. Do NOT file issues in that case; the factory
      # must never spam GitHub with bogus product bugs when it cannot
      # prove its own test harness ran. This is the comprehensive-test
      # analog of validate-pr's Fix #8 "rule 0".
      TEST_MD_COUNT=$(find "$ARTIFACTS_DIR" -maxdepth 1 -name "test-*.md" 2>/dev/null | wc -l)
      TEST_MD_COUNT=$(echo "$TEST_MD_COUNT" | tr -d ' ')
      if [ "$TEST_MD_COUNT" -lt 4 ]; then
        echo "INFRA_FAILURE: found $TEST_MD_COUNT test-*.md files (expected 4)."
        echo "Scenarios were skipped or crashed before writing evidence."
        echo "Not filing any issues."
        echo "[]" > "$ARTIFACTS_DIR/filed-issues.json"
        # NON-ZERO, and this used to be `exit 0`. A harness that could not prove it ran
        # is not a harness that found nothing wrong, and exiting successfully made a
        # broken regression run indistinguishable from a clean one in every log and
        # every notification. The run is failed; FACTORY_RULES.md 4 escalates on two
        # consecutive failures, which is exactly the signal wanted here.
        exit 1
      fi
      echo "SCENARIOS_RAN=$TEST_MD_COUNT"

      # Extract the JSON block from the report. The report synthesizer
      # wraps the failure list in a ```json fenced block.
      FAILURES_JSON=$(awk '
        /^```json/ {flag=1; next}
        /^```/     {flag=0}
        flag        {print}
      ' "$REPORT")

      # EMPTY IS NOT PASS.
      #
      # This block used to say "no JSON failure block found - treating as 0 failures"
      # and set FAILURES_JSON="[]". That is the precise shape of the bug this factory
      # exists to warn people about: a step whose OUTPUT could not be read was scored as
      # a step that found nothing wrong. A synthesizer that crashed, got truncated, or
      # stopped fencing its output printed "Comprehensive test: ALL GREEN" and filed no
      # issues, on a run where nothing had been checked at all.
      #
      # The synthesizer's contract (`dark-factory-comprehensive-report.md`) requires an
      # empty array inside the block when there are zero failures. So a MISSING block is
      # never "no failures" - it is always the synthesizer having failed to do its job,
      # and there is no reading of it that is good news.
      if [ -z "$FAILURES_JSON" ]; then
        echo "REPORT_UNPARSEABLE: no fenced json block in $REPORT" >&2
        echo "The synthesizer must emit [] when there are zero failures, so an absent" >&2
        echo "block means it failed. This run proved nothing and is not green." >&2
        exit 1
      fi

      if ! COUNT=$(echo "$FAILURES_JSON" | jq 'length' 2>/dev/null); then
        echo "REPORT_UNPARSEABLE: the fenced block is not valid JSON" >&2
        exit 1
      fi
      echo "REPORT_PARSED failures=$COUNT"

      if [ "$COUNT" = "0" ]; then
        echo "No failures to file. Comprehensive test: ALL GREEN."
        echo "[]" > "$ARTIFACTS_DIR/filed-issues.json"
        echo "FILE_ISSUES_OK filed=0 scenarios=$TEST_MD_COUNT"
        exit 0
      fi

      > "$ARTIFACTS_DIR/filed-issues.json.tmp"
      echo "[" > "$ARTIFACTS_DIR/filed-issues.json.tmp"
      FIRST=1

      echo "$FAILURES_JSON" | jq -c '.[]' | while read -r failure; do
        TITLE=$(echo "$failure" | jq -r '.title')
        BODY=$(echo "$failure" | jq -r '.body')
        SCENARIO=$(echo "$failure" | jq -r '.scenario')

        # Dedup: search open issues with the same title already labeled
        # factory:from-comprehensive-test. If one exists, skip creating a
        # duplicate - the existing issue will continue through the triage
        # pipeline on its own.
        EXISTING=$(gh issue list \
          --state open \
          --label "factory:from-comprehensive-test" \
          --search "$TITLE in:title" \
          --json number,title \
          --jq '.[0].number // empty')

        if [ -n "$EXISTING" ]; then
          echo "Skipping duplicate of #$EXISTING for scenario=$SCENARIO"
          NUMBER="$EXISTING"
          ACTION="deduped"
        else
          NUMBER=$(gh issue create \
            --title "$TITLE" \
            --body  "$BODY" \
            --label "bug" \
            --label "factory:from-comprehensive-test" \
            | awk -F/ '{print $NF}')
          echo "Filed issue #$NUMBER for scenario=$SCENARIO"
          ACTION="created"
        fi

        if [ $FIRST -eq 0 ]; then
          echo "," >> "$ARTIFACTS_DIR/filed-issues.json.tmp"
        fi
        FIRST=0
        echo "{\"scenario\":\"$SCENARIO\",\"issue\":$NUMBER,\"action\":\"$ACTION\"}" \
          >> "$ARTIFACTS_DIR/filed-issues.json.tmp"
      done

      echo "" >> "$ARTIFACTS_DIR/filed-issues.json.tmp"
      echo "]" >> "$ARTIFACTS_DIR/filed-issues.json.tmp"
      mv "$ARTIFACTS_DIR/filed-issues.json.tmp" "$ARTIFACTS_DIR/filed-issues.json"

      echo "=== filed-issues.json ==="
      cat "$ARTIFACTS_DIR/filed-issues.json"
      # A positive marker with a count, so a downstream reader can tell this node from
      # one that died halfway through the loop with a half-written file.
      echo "FILE_ISSUES_OK filed=$(jq 'length' "$ARTIFACTS_DIR/filed-issues.json") scenarios=$TEST_MD_COUNT"
    timeout: 120000
