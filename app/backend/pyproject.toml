# Backend project definition for the Virtual Agent.
#
# Managed with `uv` (not pip, not poetry). `pyproject.toml` is the dependency
# source of truth; `uv.lock` (committed) pins exact versions.
#
# Install everything:
#     cd app/backend && uv sync --all-extras
#
# Run the backend from the `app/` directory (not `app/backend/`) because the
# `backend.main:app` import path requires it:
#     cd app && uv --project backend run uvicorn backend.main:app --reload --port 8000

[project]
name = "virtualagent-backend"
version = "0.1.0"
description = "Virtual Agent service: language detection, wiki answers, web fallback, spoken turns"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
    "openai",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.2",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "respx==0.22.0",
    "pyyaml==6.0.2",
    "types-pyyaml==6.0.12.20241230",
]

[build-system]
# This project is not a library; uv only needs a build backend because
# `[project]` requires one. hatchling is the uv/PEP 621 default.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line-too-long: format handles this
    "B008",  # FastAPI uses Depends() in defaults intentionally
    "RUF001",  # the product speaks Arabic; its letters are not confusables
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011", "B017"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["(^|/)\\.venv/", "(^|/)venv/", "^__pycache__/", "^dist/", "^build/"]
# tests/ is not a package: its modules import the fakes as top-level `conftest`.
mypy_path = "tests"
namespace_packages = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# `backend` is a package under app/, so app/ is the import root.
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "-v --tb=short"
