# XcodeGen spec. Generate with `xcodegen generate` from this directory.
name: VirtualAgent
options:
  bundleIdPrefix: com.virtualagent
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  VirtualAgent:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VirtualAgent
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.virtualagent.mobile
        INFOPLIST_FILE: VirtualAgent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
  VirtualAgentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VirtualAgentTests
    dependencies:
      - target: VirtualAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.virtualagent.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VirtualAgent:
    build:
      targets:
        VirtualAgent: all
        VirtualAgentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VirtualAgentTests
