# The wiki import tool: turns any document into the wiki's knowledge format.
#
#     uv run --project tools/wiki python tools/wiki/ingest.py <files or folders> --out <wiki folder>
#
# Its own project so the service keeps its five dependencies: converting Word, PDF and
# spreadsheet files needs libraries the service must never carry.

[project]
name = "virtualagent-wiki-tools"
version = "0.1.0"
description = "Import any document into the Virtual Agent wiki's knowledge format"
requires-python = ">=3.11"
dependencies = [
    "markitdown[docx,pdf,pptx,xlsx]",
]

[project.optional-dependencies]
dev = [
    "ruff==0.9.2",
    "pytest==8.3.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
